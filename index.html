  <body>
    <div id="root"></div>
    <script>
      (() => {
        const notes = [
          {
            key: 'hero',
            label: 'AI runtime / intent layer',
            text: "Je ne traite pas l'IA comme une simple interface de chat ou un gadget de productivité. Ce qui m'intéresse, c'est la construction d'un runtime utile: des agents capables de lire un contexte, de raisonner sur un objectif, d'appeler des outils, de conserver un état de travail et de revenir avec une sortie exploitable. L'enjeu n'est pas de produire une belle demo, mais de faire tenir un système dans la durée, sous contrainte, avec des entrées imparfaites, des dépendances instables et des décisions qui doivent rester traçables."
          },
          {
            key: 'albums',
            label: 'Recon / signal extraction',
            text: "L'approche est clairement inspirée du monde hacking: reconnaissance, énumération, corrélation, réduction du bruit, exploitation des signaux faibles, puis enchaînement d'actions concrètes. Un bon agent ne doit pas juste répondre; il doit inspecter, vérifier, recouper, détecter les impasses, relancer une piste et documenter ce qu'il fait. Dans ce cadre, l'IA devient une couche d'orchestration offensive et défensive à la fois: elle peut explorer un périmètre technique, assister l'analyse de code, accélérer l'investigation, extraire des anomalies dans les logs et transformer une masse de données brutes en plan d'action."
          },
          {
            key: 'gallery',
            label: 'Multi-agent orchestration',
            text: "L'orchestration multi-agents commence quand un seul modèle ne suffit plus. Il faut router les tâches, choisir le bon outil, distribuer les étapes entre spécialistes, gérer les retries, contrôler la latence, limiter le coût et maintenir une mémoire de session assez propre pour ne pas se noyer dans son propre contexte. Un agent peut surveiller, un autre analyser, un autre écrire, un autre vérifier, puis un dernier produire un rapport ou ouvrir la bonne action humaine. Le vrai sujet n'est pas l'effet waouh du modèle, mais la qualité du pipeline, la discipline des permissions et la capacité à faire circuler l'information sans casser la chaîne."
          },
          {
            key: 'tour',
            label: 'Security / control plane',
            text: "Cette logique impose une hygiène technique stricte. Isolation des secrets, périmètres d'action limités, journaux d'exécution, traces lisibles, garde-fous sur les appels réseau, validation des sorties et points de reprise propres quand une étape échoue. Plus un agent devient autonome, plus la surface de risque augmente. L'autonomie n'a de valeur que si elle reste gouvernable: droits minimaux, auditabilité, observabilité, et possibilité de remettre un humain dans la boucle au bon moment, non pas pour micro-gérer, mais pour arbitrer les cas ambigus, sensibles ou irréversibles."
          },
          {
            key: 'contact',
            label: '24/24 execution',
            text: "C'est dans cette zone que je veux pousser le site: montrer des systèmes qui tournent vraiment, 24/24, comme une couche de veille offensive permanente. Des agents qui sniffent un périmètre, corrèlent les signaux faibles, préparent des hypothèses d'exploitation, enrichissent un dossier technique, déclenchent des actions et ne remontent à l'humain que ce qui mérite un arbitrage ou une décision irréversible. Pas de théâtre marketing autour de l'IA: seulement des machines branchées sur le réel, une culture ops, une mentalité offensive et une exécution continue."
          }
        ];

        const targets = {
          hero: () => ({
            anchor: document.querySelector('div[code-path="src/sections/Hero.tsx:155:9"]'),
            method: 'afterend'
          }),
          albums: () => ({
            anchor: document.querySelector('div[code-path="src/sections/AlbumCube.tsx:163:7"]'),
            method: 'beforeend'
          }),
          gallery: () => ({
            anchor: document.querySelector('div[code-path="src/sections/ParallaxGallery.tsx:103:9"]'),
            method: 'beforeend'
          }),
          ships: () => ({
            anchor: document.querySelector('div[code-path="src/sections/ParallaxGallery.tsx:178:9"]'),
            method: 'beforeend'
          }),
          tour: () => ({
            anchor: document.querySelector('div[code-path="src/sections/TourSchedule.tsx:92:9"]'),
            method: 'beforeend'
          }),
          contact: () => ({
            anchor: document.querySelector('p[code-path="src/sections/Footer.tsx:129:15"]'),
            method: 'afterend'
          })
        };

        const placements = {
          hero: 'hero',
          albums: 'albums',
          gallery: 'gallery',
          tour: 'ships',
          contact: 'tour'
        };

        function buildNote(note, slot) {
          const section = document.createElement('div');
          section.className = `ai-ops-note ai-ops-note--${slot}`;
          section.setAttribute('data-ai-note', note.key);

          const wrap = document.createElement('div');
          wrap.className = 'ai-ops-note__wrap';

          const label = document.createElement('p');
          label.className = 'ai-ops-note__label';
          label.textContent = note.label;

          const text = document.createElement('p');
          text.className = 'ai-ops-note__text';
          text.textContent = note.text;

          wrap.appendChild(label);
          wrap.appendChild(text);
          section.appendChild(wrap);

          return section;
        }

        function injectNotes() {
          const main = document.querySelector('#root main');
          if (!main) return false;

          notes.forEach((note) => {
            const existing = document.querySelector(`[data-ai-note="${note.key}"]`);
            if (existing) existing.remove();

            const slot = placements[note.key] || note.key;
            const targetConfig = targets[slot] && targets[slot]();
            if (!targetConfig || !targetConfig.anchor) return;

            const noteNode = buildNote(note, slot);
            if (targetConfig.method === 'beforeend') {
              targetConfig.anchor.appendChild(noteNode);
            } else {
              targetConfig.anchor.insertAdjacentElement(targetConfig.method || 'afterend', noteNode);
            }
          });

          return true;
        }

        if (injectNotes()) return;

        let attempts = 0;
        const timer = setInterval(() => {
          attempts += 1;
          if (injectNotes() || attempts > 120) clearInterval(timer);
        }, 150);
      })();
    </script>
